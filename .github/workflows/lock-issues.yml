# Upptime's status page renders every comment on an incident issue as unsanitized HTML
# (upptime/status-page Incident.svelte + snarkdown). Locking each issue on open means only
# collaborators can comment, so outsiders can't put content or script on status.savewithsail.com.
# Not generated by Upptime: update-template only rewrites its own eight workflow files.
name: Lock new issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - run: gh issue lock "$NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
